name: agrilink_mobile
description: "AgriLink AI 2.0 - Farmer Mobile App (hackX 11.0)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  provider: ^6.1.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.1
  confetti: ^0.7.0
  uuid: ^4.4.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  # Added for the Suppliers / Community Marketplace map view — shows
  # supplier and rental/seed listings as pins with tap-to-call and
  # get-directions, instead of a plain list only.
  google_maps_flutter: ^2.9.0
  # Group chat voice messages: record with `record`, play back with `audioplayers`,
  # and `path_provider` for the temporary recording file.
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  # Added earlier for the Govi Tech icon generation
  # (see flutter_launcher_icons.yaml for its config).
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Bundled so Sinhala and Tamil always draw correctly, even offline.
  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700

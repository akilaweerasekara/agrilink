name: agrilink_mobile
description: "AgriLink AI 2.0 - Farmer Mobile App (hackX 11.0)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  provider: ^6.1.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.1
  confetti: ^0.7.0
  uuid: ^4.4.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
